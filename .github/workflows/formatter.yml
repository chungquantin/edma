name: Formatter
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write # for checkout
  pull-requests: write # for comments

jobs:
  format:
    name: Format apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Automatically apply lint suggestions
        run: cargo clippy --fix -p edma_storage --no-default-features --features kv-redb,kv-sled,test-suite
      - name: Format check packages
        run: cargo fmt --all -- --check
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply formatting changes
          branch: ${{ github.head_ref }}
  check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run clippy check on workspace
        run: cargo clippy -p edma_storage --no-default-features --features kv-redb,kv-sled,test-suite
      - name: Format all packages
        run: cargo fmt --all
