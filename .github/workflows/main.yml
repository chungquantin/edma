name: Main
on: [push, pull_request]

permissions:
  contents: read # for checkout
  pull-requests: write # for comments

jobs:
  build_and_lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    name: Test `cargo check/test` on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: Build project
        run: cargo build -p edma_storage --release --no-default-features --features kv-redb,kv-sled,test-suite
      - name: Test
        run: cargo test -p edma_storage --no-default-features --features kv-redb,kv-sled,test-suite
